# X-HEEP programmer PMOD - JTAG channel for CVA6 debug module.
# Hardware: FT4232H channel A ADBUS0..3 wired to EPFL programmer PMOD_1.
# EPFL programmer PMOD_1 plugs straight into ZCU111 PMOD_1/J49.

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 0

# ADBUS0=TCK out, ADBUS1=TDI out, ADBUS2=TDO in, ADBUS3=TMS out.
# Direction low byte: TCK/TDI/TMS outputs, TDO input = 0b00001011.
# Initial low byte: TMS high, TCK low = 0b00001000.
ftdi layout_init 0x0008 0x000b

# No nTRST/nSRST is exposed on the X-HEEP programmer target PMOD.
transport select jtag
adapter speed 100

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0

riscv set_reset_timeout_sec 120
riscv set_command_timeout_sec 120
riscv set_prefer_sba off

init
# On this ZCU111/PMOD setup the first halt request after FPGA configuration
# can be ignored while the hart is already running. Use the Debug Module reset
# path, then request halt and re-examine the target.
riscv dmi_write 0x10 0x00000003
sleep 10
riscv dmi_write 0x10 0x80000001
sleep 10
riscv.cpu arp_examine
halt
riscv dmi_write 0x10 0x00000001
echo "Ready for Remote Connections"
